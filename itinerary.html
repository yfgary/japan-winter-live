<!DOCTYPE html>
<html lang="zh-HK">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#1f4e79"
    >

    <title>
        Japan Winter 2027 詳細行程
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            background: #eef2f6;

            color: #222;

            font-family:
                Arial,
                "Microsoft JhengHei",
                "Noto Sans TC",
                sans-serif;
        }



        /* =====================================================
           HEADER
        ===================================================== */

        header {

            background:
                linear-gradient(
                    135deg,
                    #163a5c,
                    #28689d
                );

            color: white;

            text-align: center;

            padding:
                24px 15px;
        }


        header h1 {

            margin: 0;

            font-size: 28px;
        }


        header p {

            margin:
                8px 0 0;

            opacity: 0.9;
        }



        /* =====================================================
           PAGE SWITCH
        ===================================================== */

        .page-switch {

            background: white;

            padding: 10px;

            text-align: center;

            box-shadow:
                0 2px 6px
                rgba(0,0,0,0.08);
        }


        .page-switch a {

            display: inline-block;

            margin: 4px;

            padding:
                9px 14px;

            border-radius: 18px;

            text-decoration: none;

            background: #eaf2f8;

            color: #1f4e79;

            font-weight: 600;

            transition:
                background 0.2s;
        }


        .page-switch a:hover {

            background: #dcebf5;
        }


        .page-switch a.active {

            background: #1f4e79;

            color: white;
        }



        /* =====================================================
           MAIN
        ===================================================== */

        .container {

            max-width: 1100px;

            margin: auto;

            padding: 20px;
        }



        /* =====================================================
           WELCOME
        ===================================================== */

        .welcome {

            background: white;

            border-radius: 14px;

            padding: 25px;

            box-shadow:
                0 2px 8px
                rgba(0,0,0,0.08);
        }


        .welcome h2 {

            margin-top: 0;

            color: #1f4e79;
        }


        .trip-date {

            font-size: 16px;

            font-weight: 600;

            margin-top: 15px;
        }


        .coming {

            margin-top: 18px;

            padding: 15px;

            background: #f5f8fb;

            border-radius: 10px;

            color: #56636e;

            line-height: 1.6;
        }



        /* =====================================================
           FOOTER
        ===================================================== */

        footer {

            text-align: center;

            padding: 30px;

            color: #777;

            font-size: 13px;
        }



        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            header {

                padding:
                    20px 10px;
            }


            header h1 {

                font-size: 22px;
            }


            .container {

                padding: 12px;
            }


            .welcome {

                padding: 18px;
            }


            .page-switch a {

                padding:
                    8px 12px;

                font-size: 14px;
            }

        }

    </style>

</head>



<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

        <h1>
            🗓️ Japan Winter 2027
        </h1>

        <p>
            日本中部 9日8夜・詳細行程
        </p>

    </header>



    <!-- =====================================================
         PAGE SWITCH
    ====================================================== -->

    <div class="page-switch">

        <a href="index.html">
            📹 Live Cam
        </a>


        <a
            href="itinerary.html"
            class="active">

            🗓️ 詳細行程

        </a>

    </div>



    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="container">


        <div class="welcome">


            <h2>
                2027 日本中部冬季自駕行程
            </h2>


            <div class="trip-date">

                📅 2027年1月9日 – 1月17日

            </div>


            <p>

                9日8夜・日本中部冬季自駕行程

            </p>


            <div class="coming">

                下一步會將完整
                <strong>D1 – D9</strong>
                詳細行程放入呢一頁。

                <br><br>

                內容會包括：

                <br>

                🕐 每日時間表<br>
                🚗 車程及路線<br>
                🏔️ 景點詳細資料<br>
                🍴 午餐／晚餐安排<br>
                🏨 酒店資料<br>
                🌨️ 冬季道路注意事項<br>
                🔄 Backup Plan<br>
                📍 Google Maps 導航<br>
                📷 景點相片

            </div>


        </div>


    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer>

        Japan Winter Trip 2027

    </footer>


</body>

</html>
