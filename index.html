<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#0b5fa8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="TravelPilot"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/jpeg" href="assets/images/travelpilot-icon-exact.jpg"><link rel="apple-touch-icon" sizes="180x180" href="assets/images/travelpilot-icon-exact.jpg"><meta name="description" content="TravelPilot 旅程管家：一個 App 集中管理所有旅程、行程、景點、天氣、自駕、Live Cam、住宿資料與出發 Checklist。"><title>TravelPilot｜旅程管家</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef4f9;color:#22313d;font-family:Arial,"Microsoft JhengHei","Noto Sans TC",sans-serif}.hero{position:relative;min-height:320px;overflow:hidden;color:#fff;background:linear-gradient(90deg,rgba(7,42,78,.88),rgba(20,101,163,.42)),url('assets/images/d7-shirakawago-view.jpg') center 43%/cover no-repeat;display:flex;align-items:center}.hero::after{content:"";position:absolute;inset:auto 0 0;height:80px;background:linear-gradient(transparent,#eef4f9)}.hero-inner{position:relative;z-index:1;width:min(1000px,100%);margin:auto;padding:42px 20px 74px;display:flex;align-items:center;gap:24px;text-align:left}.brand-icon{width:138px;height:138px;flex:0 0 138px;border-radius:29px;object-fit:cover;box-shadow:0 14px 34px rgba(0,21,48,.35),0 0 0 1px rgba(255,255,255,.22)}.brand-copy h1{margin:0;font-size:46px;line-height:1;font-weight:900;letter-spacing:-1.5px;text-shadow:0 2px 16px rgba(0,0,0,.18)}.brand-copy h2{margin:8px 0 0;font-size:26px;font-weight:900}.brand-copy .tagline{margin:15px 0 0;font-size:19px;font-weight:800}.brand-copy .features{margin:7px 0 0;font-size:14px;opacity:.94}.wrap{max-width:1000px;margin:auto;padding:0 18px 18px;position:relative;z-index:2}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:3px 0 15px}.bar h2{margin:0;color:#174f7d;font-size:27px}.count{font-size:12px;color:#6a7a86;font-weight:700}.trip-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:15px}.trip-card{overflow:hidden;background:#fff;border-radius:18px;box-shadow:0 8px 28px rgba(24,74,111,.09);border:1px solid #dce8f0;position:relative}.trip-card.active-trip{outline:3px solid rgba(22,105,171,.18)}.cover{height:170px;background:linear-gradient(135deg,#dbe7ef,#b8cedd) center/cover no-repeat;position:relative}.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.48))}.country{position:absolute;left:12px;bottom:10px;z-index:1;color:#fff;font-size:13px;font-weight:800}.trip-badges{position:absolute;top:10px;right:10px;z-index:2;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.badge{padding:5px 8px;border-radius:14px;font-size:10px;font-weight:900;background:rgba(255,255,255,.94);color:#1f4e79}.badge.test{background:#fff3c8;color:#715600}.badge.current{background:#e8f6eb;color:#2a6a3d}.trip-body{padding:16px}.trip-name{font-size:20px;font-weight:900;color:#174f7d;line-height:1.35}.trip-sub{margin-top:6px;color:#60717d;font-size:13px;line-height:1.5}.trip-date{margin-top:10px;font-size:12px;color:#526571;font-weight:700}.trip-note{margin-top:10px;padding:8px 9px;border-radius:9px;background:#fff8df;color:#755900;font-size:11px;line-height:1.5}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.open-btn{border:0;border-radius:10px;background:linear-gradient(135deg,#1266ad,#0b89dc);color:#fff;padding:9px 12px;font-weight:800;text-decoration:none;cursor:pointer;font-size:12px;box-shadow:0 5px 12px rgba(19,105,173,.18)}.secondary{background:#eef5fa;color:#1f4e79;box-shadow:none}.status{margin:18px 0;padding:14px;border-radius:11px;background:#fff;color:#61717c;font-size:13px;line-height:1.6;border:1px solid #e0ebf2}.footer{text-align:center;color:#7b8992;font-size:11px;padding:20px 10px 60px}@media(max-width:600px){.hero{min-height:290px;background-position:center}.hero-inner{padding:32px 18px 64px;gap:14px;align-items:center}.brand-icon{width:92px;height:92px;flex-basis:92px;border-radius:22px}.brand-copy h1{font-size:31px;letter-spacing:-.8px}.brand-copy h2{font-size:20px;margin-top:5px}.brand-copy .tagline{font-size:15px;margin-top:11px}.brand-copy .features{font-size:12px}.wrap{padding:0 10px 10px}.bar h2{font-size:23px}.cover{height:145px}.trip-name{font-size:18px}}
</style>
</head>
<body>
<header class="hero"><div class="hero-inner"><img class="brand-icon" src="assets/images/travelpilot-icon-exact.jpg" alt="TravelPilot icon"><div class="brand-copy"><h1>TravelPilot</h1><h2>旅程管家</h2><p class="tagline">所有旅程，一個地方管理</p><p class="features">行程・景點・天氣・自駕・Live Cam</p></div></div></header>
<main class="wrap"><div class="bar"><h2>我的旅程</h2><span class="count" id="tripCount">載入中…</span></div><div class="trip-grid" id="tripGrid"></div><div class="status" id="tripStatus">正在載入旅程資料…</div></main>
<div class="footer">TravelPilot｜旅程管家・你的旅程資料、行程工具與即時資訊集中管理</div>
<script src="assets/multi-trip-context-v1.js?v=22"></script>
<script>
(function(){
 const fallback={id:'shirakawago-shinhotaka-2027',name:'白川鄉・新穗高之旅 2027',shortName:'白川鄉・新穗高 2027',subtitle:'日本中部冬季自駕・9日8夜',startDate:'2027-01-09',endDate:'2027-01-17',country:'日本',emoji:'🇯🇵',cover:'assets/images/d7-shirakawago-view.jpg',entry:'itinerary.html',status:'active',badge:'正式旅程',features:{itinerary:true,tripInfo:true,attractions:true,liveCam:true}};
 const grid=document.getElementById('tripGrid'),count=document.getElementById('tripCount'),status=document.getElementById('tripStatus');
 const active=localStorage.getItem('multiTrip.activeTrip')||'';
 function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c));}
 function fmt(s){if(!s)return'';const p=s.split('-');return p.length===3?p[0]+'/'+p[1]+'/'+p[2]:s;}
 function url(file,id){return file+'?trip='+encodeURIComponent(id);}
 function link(label,file,t,secondary){return '<a class="open-btn'+(secondary?' secondary':'')+'" href="'+url(file,t.id)+'" data-trip="'+esc(t.id)+'">'+label+'</a>';}
 function card(t){
  const f=t.features||{},isTest=t.status==='test',isCurrent=active===t.id;
  const el=document.createElement('article');el.className='trip-card'+(isCurrent?' active-trip':'');
  const cover=t.cover?"background-image:url('"+esc(t.cover)+"')":'';
  let actions='';if(f.itinerary!==false)actions+=link('🗓️ 開啟行程',t.entry||'itinerary.html',t,false);if(f.tripInfo!==false)actions+=link('🧳 旅程資料','trip-info.html',t,true);if(f.attractions!==false)actions+=link('🗾 景點','attractions.html',t,true);if(f.liveCam!==false)actions+=link('📹 Live Cam','live.html',t,true);
  el.innerHTML='<div class="cover" style="'+cover+'"><div class="country">'+esc(t.emoji||'✈️')+' '+esc(t.country||'')+'</div><div class="trip-badges"><span class="badge '+(isTest?'test':'')+'">'+esc(t.badge||(isTest?'測試':'旅程'))+'</span>'+(isCurrent?'<span class="badge current">上次使用</span>':'')+'</div></div><div class="trip-body"><div class="trip-name">'+esc(t.name)+'</div><div class="trip-sub">'+esc(t.subtitle||'')+'</div><div class="trip-date">📅 '+esc(fmt(t.startDate))+' – '+esc(fmt(t.endDate))+'</div>'+(isTest?'<div class="trip-note">🧪 呢個係架構驗證 Trip，資料唔代表真實預訂；用嚟測試第二套行程係咪完全由共用 Renderer 生成。</div>':'')+'<div class="actions">'+actions+'</div></div>';
  el.querySelectorAll('[data-trip]').forEach(x=>x.addEventListener('click',()=>{try{localStorage.setItem('multiTrip.activeTrip',t.id);}catch(e){}}));return el;
 }
 function render(trips){trips=[...trips].sort((a,b)=>String(b.startDate||'').localeCompare(String(a.startDate||'')));grid.innerHTML='';trips.forEach(t=>grid.appendChild(card(t)));count.textContent=trips.length+' 個旅程';status.innerHTML=trips.some(t=>t.status==='test')?'✅ TravelPilot 已啟用。<strong>正式旅程</strong>同<strong>架構測試 Trip</strong>共用同一套核心功能；各 Trip 資料互相獨立。':'選擇一個旅程開始。';}
 fetch('trips/registry.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json();}).then(x=>render((x.trips||[]).filter(t=>t.status!=='hidden'))).catch(()=>{render([fallback]);status.textContent='目前離線，顯示已內置旅程。';});
})();
</script>
</body></html>
