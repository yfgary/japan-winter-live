*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:linear-gradient(#eaf5fc 0,#f7fbfe 400px,#eff6fb 100%);color:var(--ink);font-family:Arial,"Microsoft JhengHei","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit}.sitebar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.93);backdrop-filter:blur(18px);border-bottom:1px solid rgba(176,205,226,.72);box-shadow:0 3px 18px rgba(17,67,105,.07)}.sitebar-inner{max-width:1180px;margin:auto;min-height:66px;padding:9px 18px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand-mini{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:900;color:#123b72;white-space:nowrap}.brand-mini img{width:42px;height:42px;border-radius:11px;object-fit:cover;box-shadow:0 4px 12px rgba(16,93,160,.2)}.brand-mini span{font-size:19px}.topnav{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:flex-end}.topnav a{padding:9px 11px;border-radius:12px;text-decoration:none;font-size:13px;font-weight:800;color:#173c68}.topnav a:hover,.topnav a.active{background:#e8f4ff;color:#0572cf}.topnav .search{width:37px;height:37px;display:grid;place-items:center;border-radius:50%;background:#f0f7fc;font-size:18px}
.hero{position:relative;isolation:isolate;overflow:hidden;min-height:355px;background:url('assets/images/d7-shirakawago-view.jpg') center 43%/cover no-repeat}.hero:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(237,248,255,.93) 0%,rgba(237,248,255,.72) 42%,rgba(231,247,255,.22) 69%,rgba(232,246,255,.08) 100%)}.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:80px;background:linear-gradient(transparent,var(--bg))}.hero-inner{max-width:1180px;margin:auto;padding:38px 28px 78px;display:flex;align-items:center;gap:28px;min-height:355px}.hero-logo{width:164px;height:164px;flex:0 0 164px;border-radius:35px;object-fit:cover;box-shadow:0 18px 42px rgba(4,67,126,.26),0 0 0 1px rgba(255,255,255,.55)}.hero-copy{color:var(--deep);text-shadow:0 1px 0 rgba(255,255,255,.75)}.hero-copy h1{margin:0;font-size:53px;line-height:.98;font-weight:900;letter-spacing:-2.2px}.hero-copy h1 .pilot{color:#0a8edf}.hero-copy h2{margin:10px 0 0;font-size:31px;line-height:1.1;font-weight:900;letter-spacing:.06em}.hero-copy .tagline{margin:17px 0 0;font-size:21px;font-weight:900}.hero-copy .features{margin:7px 0 0;font-size:15px;font-weight:700;color:#315a7c}.plane{position:absolute;right:10%;top:68px;font-size:48px;transform:rotate(-7deg);filter:drop-shadow(0 5px 6px rgba(9,88,151,.18))}
.wrap{max-width:1180px;margin:-34px auto 0;padding:0 18px 36px;position:relative;z-index:3}.quick-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;margin-bottom:18px}.quick-card{min-height:108px;background:rgba(255,255,255,.95);border:1px solid rgba(217,232,242,.92);border-radius:17px;box-shadow:0 8px 24px rgba(34,86,126,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;text-decoration:none;padding:12px 8px;transition:.18s}.quick-card:hover{transform:translateY(-2px);box-shadow:0 12px 27px rgba(34,86,126,.14)}.quick-card .ico{font-size:30px;line-height:1}.quick-card strong{margin-top:8px;font-size:14px;color:#102f59}.quick-card small{margin-top:4px;color:#7d90a0;font-size:10px;font-weight:700}.section{background:rgba(255,255,255,.82);border:1px solid rgba(219,232,241,.9);border-radius:20px;box-shadow:0 8px 30px rgba(26,81,123,.07);padding:17px;margin-top:16px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.section-head h2{margin:0;font-size:23px;color:#143d70}.section-head .count,.section-head a{font-size:12px;color:#0b78d0;font-weight:800;text-decoration:none}.trip-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.trip-card{overflow:hidden;background:#fff;border-radius:17px;border:1px solid #dce8f0;box-shadow:0 7px 20px rgba(20,71,111,.08);position:relative}.trip-card.active-trip{outline:3px solid rgba(10,126,214,.2)}.cover{height:180px;background:linear-gradient(135deg,#dbe7ef,#b8cedd) center/cover no-repeat;position:relative}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 38%,rgba(3,24,47,.68))}.country{position:absolute;left:14px;bottom:12px;z-index:1;color:#fff;font-size:13px;font-weight:900}.trip-badges{position:absolute;top:10px;right:10px;z-index:2;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.badge{padding:6px 9px;border-radius:16px;font-size:10px;font-weight:900;background:rgba(255,255,255,.94);color:#1f4e79}.badge.test{background:#fff3c8;color:#715600}.badge.current{background:#e8f6eb;color:#2a6a3d}.trip-body{padding:15px}.trip-name{font-size:21px;font-weight:900;color:#174f7d;line-height:1.35}.trip-sub{margin-top:5px;color:#60717d;font-size:13px;line-height:1.5}.trip-date{margin-top:9px;font-size:12px;color:#526571;font-weight:800}.trip-note{margin-top:10px;padding:9px;border-radius:10px;background:#fff8df;color:#755900;font-size:11px;line-height:1.5}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.open-btn{border:0;border-radius:11px;background:linear-gradient(135deg,#1266ad,#0b94e7);color:#fff;padding:10px 13px;font-weight:900;text-decoration:none;font-size:12px;box-shadow:0 5px 13px rgba(19,105,173,.19)}.secondary{background:#eef5fa;color:#1f4e79;box-shadow:none}.dest-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.dest{height:118px;border-radius:14px;overflow:hidden;position:relative;background:#c8dbea center/cover no-repeat}.dest:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 48%,rgba(5,22,43,.72))}.dest span{position:absolute;left:11px;bottom:10px;z-index:1;color:white;font-weight:900;font-size:15px;text-shadow:0 2px 5px rgba(0,0,0,.3)}.status{margin-top:15px;padding:12px 14px;border-radius:12px;background:#fff;color:#657987;font-size:12px;line-height:1.55;border:1px solid #e0ebf2}.footer{text-align:center;color:#7b8992;font-size:11px;padding:12px 10px 45px}
@media(max-width:900px){.topnav a{display:none}.topnav .search{display:grid}.quick-grid{grid-template-columns:repeat(4,1fr)}.dest-grid{grid-template-columns:repeat(3,1fr)}.hero-copy h1{font-size:46px}.hero-logo{width:145px;height:145px;flex-basis:145px}}
@media(max-width:600px){.sitebar-inner{min-height:58px;padding:8px 12px}.brand-mini img{width:38px;height:38px;border-radius:10px}.brand-mini span{font-size:16px}.hero{min-height:300px;background-position:center}.hero-inner{min-height:300px;padding:28px 18px 69px;gap:14px;align-items:center}.hero-logo{width:94px;height:94px;flex-basis:94px;border-radius:22px}.hero-copy h1{font-size:30px;letter-spacing:-1px}.hero-copy h2{font-size:20px;margin-top:6px}.hero-copy .tagline{font-size:15px;margin-top:11px}.hero-copy .features{font-size:11px}.plane{font-size:30px;top:49px;right:7%}.wrap{margin:-29px auto 0;padding:0 10px 28px}.quick-grid{grid-template-columns:repeat(4,1fr);gap:7px}.quick-card{min-height:89px;border-radius:14px;padding:8px 4px}.quick-card .ico{font-size:24px}.quick-card strong{font-size:12px;margin-top:5px}.quick-card small{font-size:8px}.section{padding:12px;border-radius:16px}.section-head h2{font-size:20px}.trip-grid{grid-template-columns:1fr}.cover{height:155px}.trip-name{font-size:18px}.dest-grid{grid-template-columns:repeat(2,1fr)}.dest{height:105px}}
</style>

<body>
<nav class="sitebar"><div class="sitebar-inner"><a class="brand-mini" href="index.html"><img src="assets/images/travelpilot-icon-exact.jpg?v=10.10.11" alt=""><span>TravelPilot 旅程管家</span></a><div class="topnav"><a class="active" href="index.html">🏠 首頁</a><a href="itinerary.html">🗓 行程</a><a href="attractions.html">📍 景點</a><a href="itinerary.html#weather">🌦 天氣</a><a href="itinerary.html">🚗 自駕</a><a href="live.html">📷 Live Cam</a><a href="trip-info.html">🧳 旅遊資料</a><a class="search" href="#trips" aria-label="旅程">⌕</a></div></div></nav>

<script src="assets/multi-trip-context-v1.js?v=22"></script>
<script>
(function(){
 const fallback={id:'shirakawago-shinhotaka-2027',name:'白川鄉・新穗高之旅 2027',shortName:'白川鄉・新穗高 2027',subtitle:'日本中部冬季自駕・9日8夜',startDate:'2027-01-09',endDate:'2027-01-17',country:'日本',emoji:'🇯🇵',cover:'assets/images/d7-shirakawago-view.jpg',entry:'itinerary.html',status:'active',badge:'正式旅程',features:{itinerary:true,tripInfo:true,attractions:true,liveCam:true}};
 const grid=document.getElementById('tripGrid'),count=document.getElementById('tripCount'),status=document.getElementById('tripStatus');
 const active=localStorage.getItem('multiTrip.activeTrip')||'';
 function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c));}
 function fmt(s){if(!s)return'';const p=s.split('-');return p.length===3?p[0]+'/'+p[1]+'/'+p[2]:s;}
 function url(file,id){return file+'?trip='+encodeURIComponent(id);}
 function link(label,file,t,secondary){return '<a class="open-btn'+(secondary?' secondary':'')+'" href="'+url(file,t.id)+'" data-trip="'+esc(t.id)+'">'+label+'</a>';}
 function card(t){
  const f=t.features||{},isTest=t.status==='test',isCurrent=active===t.id;
  const el=document.createElement('article');el.className='trip-card'+(isCurrent?' active-trip':'');
  const cover=t.cover?"background-image:url('"+esc(t.cover)+"')":'';
  let actions='';if(f.itinerary!==false)actions+=link('▶ 開啟行程',t.entry||'itinerary.html',t,false);if(f.tripInfo!==false)actions+=link('🧳 旅程資料','trip-info.html',t,true);if(f.attractions!==false)actions+=link('📍 景點','attractions.html',t,true);if(f.liveCam!==false)actions+=link('📷 Live Cam','live.html',t,true);
  el.innerHTML='<div class="cover" style="'+cover+'"><div class="country">'+esc(t.emoji||'✈️')+' '+esc(t.country||'')+'</div><div class="trip-badges"><span class="badge '+(isTest?'test':'')+'">'+esc(t.badge||(isTest?'測試':'旅程'))+'</span>'+(isCurrent?'<span class="badge current">上次使用</span>':'')+'</div></div><div class="trip-body"><div class="trip-name">'+esc(t.name)+'</div><div class="trip-sub">'+esc(t.subtitle||'')+'</div><div class="trip-date">📅 '+esc(fmt(t.startDate))+' – '+esc(fmt(t.endDate))+'</div>'+(isTest?'<div class="trip-note">🧪 呢個係架構驗證 Trip，資料唔代表真實預訂；用嚟測試第二套行程係咪完全由共用 Renderer 生成。</div>':'')+'<div class="actions">'+actions+'</div></div>';
  el.querySelectorAll('[data-trip]').forEach(x=>x.addEventListener('click',()=>{try{localStorage.setItem('multiTrip.activeTrip',t.id);}catch(e){}}));return el;
 }
 function render(trips){trips=[...trips].sort((a,b)=>String(b.startDate||'').localeCompare(String(a.startDate||'')));grid.innerHTML='';trips.forEach(t=>grid.appendChild(card(t)));count.textContent=trips.length+' 個旅程';status.innerHTML=trips.some(t=>t.status==='test')?'✅ TravelPilot 已啟用。<strong>正式旅程</strong>同<strong>架構測試 Trip</strong>共用同一套核心功能；各 Trip 資料互相獨立。':'選擇一個旅程開始。';}
 fetch('trips/registry.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json();}).then(x=>render((x.trips||[]).filter(t=>t.status!=='hidden'))).catch(()=>{render([fallback]);status.textContent='目前離線，顯示已內置旅程。';});
})();
</script>
