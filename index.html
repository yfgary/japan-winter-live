            font-size: 13px;

        }

        }

        .container {

        }

            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 15px;
            font-size: 14px;
            line-height: 1.55;
        }

            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,.07);
            overflow: hidden;
            scroll-margin-top: 65px;
        }

        details.region > summary {
            list-style: none;
            cursor: pointer;
            padding: 17px 19px;
            display: flex;
            align-items: center;
            gap: 12px;
            user-select: none;
        }

        details.region > summary::-webkit-details-marker {
            display: none;
        }

        .summary-main {
            min-width: 0;
            flex: 1;
        }

        .summary-title {
            font-size: 21px;
            font-weight: 700;
        }

        .day-line {
            margin-top: 5px;
            color: #1f4e79;
            font-size: 14px;
            font-weight: 700;
        }

        .summary-desc {
            margin-top: 5px;
            color: #687580;
            font-size: 13px;
            line-height: 1.45;
        }

        .count {
            flex-shrink: 0;
            padding: 5px 9px;
            border-radius: 15px;
            background: #eaf2f8;
            color: #1f4e79;
            font-size: 11px;
            font-weight: 700;
        }

        details.region > summary::after {
            content: "＋";
            color: #1f4e79;
            font-size: 24px;
            font-weight: bold;
        }

        details.region[open] > summary::after {
            content: "−";
        }

        details.region[open] > summary {
            border-bottom: 1px solid #e4eaef;
        }

        .region-body {
            padding: 17px;
        }

        .cam-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

            min-width: 0;
            background: #f6f8fa;
            border-radius: 11px;
            padding: 13px;
        }

        .cam-top {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin-bottom: 9px;
        }

            min-width: 0;
            flex: 1;

            margin: 0;
            font-size: 16px;
            line-height: 1.3;

            font-size: 12px;
            line-height: 1.5;

            color: #25713c;
        }

        .badge-road {
            background: #fff0d2;
            color: #856000;
        }

            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 9px;
            background: #172029;
            display: flex;
            align-items: center;
            justify-content: center;

            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 15px;
            color: #bbc6ce;
            font-size: 12px;

            z-index: 2;
            width: 100%;
            height: 100%;
            border: 0;
            background: #000;

            display: none;
            width: 100%;
            height: 100%;

            text-decoration: none;

/* =========================================================
   Render
========================================================= */

function youtubeEmbed(id) {

    return (
        "https://www.youtube-nocookie.com/embed/" +
        encodeURIComponent(id) +
        "?autoplay=1&mute=1&controls=0&rel=0&playsinline=1"
    );

}


function cacheBust(url) {

    return (
        url +
        (url.includes("?") ? "&" : "?") +
        "t=" +
        Date.now()
    );

}


function renderCam(cam) {

    if (cam.type === "youtube") {

        return `
        <div class="cam-card">

            <div class="cam-top">

                <div class="cam-text">
                    <h3>${cam.name}</h3>
                    ${cam.desc ? `<p>${cam.desc}</p>` : ""}
                </div>

                <span class="badge badge-video">
                    LIVE VIDEO
                </span>

            </div>


            <div class="media-box">

                <div class="media-status">
                    展開後載入 Live Camera…
                </div>

                <iframe
                    class="live-video"
                    data-src="${youtubeEmbed(cam.id)}"
                    title="${cam.name}"
                    allow="autoplay; encrypted-media; picture-in-picture"
                    allowfullscreen>
                </iframe>

            </div>


            <div class="actions">

                <a
                    class="button"
                    href="https://www.youtube.com/watch?v=${cam.id}"
                    target="_blank"
                    rel="noopener">
                    🔗 全螢幕
                </a>

            </div>

        </div>
        `;

    }


    if (cam.type === "image") {

        return `
        <div class="cam-card">

            <div class="cam-top">

                <div class="cam-text">
                    <h3>${cam.name}</h3>
                    ${cam.desc ? `<p>${cam.desc}</p>` : ""}
                </div>

                <span class="badge badge-road">
                    道路 CAM
                </span>

            </div>


            <div class="media-box">

                <div class="media-status">
                    展開後載入最新道路圖片…
                </div>

                <img
                    class="live-img"
                    data-src="${cam.url}"
                    alt="${cam.name}"
                >

            </div>


            <div class="actions">

                ${
                    cam.source
                    ?
                    `
                    <a
                        class="button secondary"
                        href="${cam.source}"
                        target="_blank"
                        rel="noopener">
                        🛣️ 官方來源
                    </a>
                    `
                    :
                    ""
                }

            </div>

        </div>
        `;
    }

}


function renderSection(section) {

    return `
    <details
        class="region"
        id="${section.id}">

        <summary>

            <div class="summary-main">

                <div class="summary-title">
                    ${section.title}
                </div>

                <div class="day-line">
                    ${section.day}
                </div>

                <div class="summary-desc">
                    ${section.desc}
                </div>

            </div>

            <span class="count">
                ${section.cams.length} 個 Camera
            </span>

        </summary>


        <div class="region-body">

            ${
                section.weather
                ?
                `
                <div class="weather-note">
                    🌨️ ${section.weather}
                </div>
                `
                :
                ""
            }


            <div class="cam-grid">

                ${section.cams.map(renderCam).join("")}

            </div>


            ${
                section.links && section.links.length
                ?
                `
                <div class="official-links">

                    <div class="official-links-title">
                        官方／其他實用入口
                    </div>

                    <div class="link-row">

                        ${section.links.map(link => `
                            <a
                                class="small-link"
                                href="${link.url}"
                                target="_blank"
                                rel="noopener">
                                ${link.name}
                            </a>
                        `).join("")}

                    </div>

                </div>
                `
                :
                ""
            }

        </div>

    </details>
    `;
}


document.getElementById("app").innerHTML =
    sections.map(renderSection).join("");


/* =========================================================
   Shortcut Navigation
========================================================= */

const quickNav =
    document.getElementById("quickNav");


sections.forEach(section => {

    const a =
        document.createElement("a");

    a.className =
        "nav-btn";

    a.href =
        "#" + section.id;

    a.textContent =
        section.nav;


    a.addEventListener(
        "click",
        function(e) {

            e.preventDefault();

            const target =
                document.getElementById(
                    section.id
                );

            target.open = true;

            loadSection(target);

            setTimeout(() => {

                target.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });

            }, 50);

        }
    );


    quickNav.appendChild(a);

});


/* =========================================================
   Load / Stop
========================================================= */

function loadSection(details) {

    details
        .querySelectorAll("iframe.live-video")
        .forEach(frame => {

            if (!frame.hasAttribute("src")) {

                frame.src =
                    frame.dataset.src;

                frame.addEventListener(
                    "load",
                    () => {

                        frame
                            .closest(".media-box")
                            .classList.add("loaded");

                    },
                    { once: true }
                );

            }

        });


    details
        .querySelectorAll("img.live-img")
        .forEach(img => {

            loadImage(img);

        });

}


function stopSection(details) {

    details
        .querySelectorAll("iframe.live-video")
        .forEach(frame => {

            frame.removeAttribute("src");

            frame
                .closest(".media-box")
                .classList.remove("loaded");

        });

}


function loadImage(img) {

    const box =
        img.closest(".media-box");

    const status =
        box.querySelector(".media-status");


    box.classList.remove("loaded");


    img.onload =
        function() {

            box.classList.add("loaded");

            status.textContent = "";

        };


    img.onerror =
        function() {

            box.classList.remove("loaded");

            status.innerHTML =
                "⚠️ 暫時未能讀取圖片<br>請按下面官方來源";

        };


    img.src =
        cacheBust(
            img.dataset.src
        );

}


/* =========================================================
   Toggle
========================================================= */

document
    .querySelectorAll("details.region")
    .forEach(details => {

        details.addEventListener(
            "toggle",
            function() {

                if (this.open) {
                    loadSection(this);
                }
                else {
                    stopSection(this);
                }

            }
        );

    });


/* =========================================================
   Buttons
========================================================= */

document
    .getElementById("closeAll")
    .addEventListener(
        "click",
        function() {

            document
                .querySelectorAll("details.region")
                .forEach(details => {

                    details.open = false;

                });

        }
    );


document
    .getElementById("refreshImages")
    .addEventListener(
        "click",
        function() {

            document
                .querySelectorAll(
                    "details.region[open] img.live-img"
                )
                .forEach(loadImage);

        }
    );


/* =========================================================
   自動刷新道路 Camera
========================================================= */

setInterval(
    function() {

        document
            .querySelectorAll(
                "details.region[open] img.live-img"
            )
            .forEach(loadImage);

    },
    10 * 60 * 1000
);


/* =========================================================
   URL #D
========================================================= */

window.addEventListener(
    "load",
    function() {

        if (location.hash) {

            const target =
                document.querySelector(
                    location.hash
                );

            if (
                target &&
                target.matches("details.region")
            ) {

                target.open = true;

                loadSection(target);

            }

        }

    }
);

</script>
