<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#1f4e79"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="My Trips"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/images/app-icon-192.png"><title>My Trips・旅行中心</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#22313d;font-family:Arial,"Microsoft JhengHei","Noto Sans TC",sans-serif}.hero{background:linear-gradient(135deg,#163a5c,#28689d);color:#fff;padding:34px 18px 30px;text-align:center}.hero h1{margin:0;font-size:30px}.hero p{margin:9px 0 0;opacity:.9}.wrap{max-width:1000px;margin:auto;padding:18px}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:3px 0 15px}.bar h2{margin:0;color:#1f4e79}.count{font-size:12px;color:#6a7a86;font-weight:700}.trip-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:15px}.trip-card{overflow:hidden;background:#fff;border-radius:16px;box-shadow:0 3px 12px rgba(0,0,0,.08);border:1px solid #dde5eb;position:relative}.trip-card.active-trip{outline:3px solid rgba(31,78,121,.18)}.cover{height:170px;background:linear-gradient(135deg,#dbe7ef,#b8cedd) center/cover no-repeat;position:relative}.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.42))}.country{position:absolute;left:12px;bottom:10px;z-index:1;color:#fff;font-size:13px;font-weight:800}.trip-badges{position:absolute;top:10px;right:10px;z-index:2;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.badge{padding:5px 8px;border-radius:14px;font-size:10px;font-weight:900;background:rgba(255,255,255,.92);color:#1f4e79}.badge.test{background:#fff3c8;color:#715600}.badge.current{background:#e8f6eb;color:#2a6a3d}.trip-body{padding:16px}.trip-name{font-size:20px;font-weight:900;color:#1f4e79;line-height:1.35}.trip-sub{margin-top:6px;color:#60717d;font-size:13px;line-height:1.5}.trip-date{margin-top:10px;font-size:12px;color:#526571;font-weight:700}.trip-note{margin-top:10px;padding:8px 9px;border-radius:9px;background:#fff8df;color:#755900;font-size:11px;line-height:1.5}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.open-btn{border:0;border-radius:9px;background:#1f4e79;color:#fff;padding:9px 12px;font-weight:800;text-decoration:none;cursor:pointer;font-size:12px}.secondary{background:#eef4f8;color:#1f4e79}.status{margin:18px 0;padding:14px;border-radius:11px;background:#fff;color:#61717c;font-size:13px;line-height:1.6}.footer{text-align:center;color:#7b8992;font-size:11px;padding:20px 10px 60px}.version{position:fixed;left:10px;bottom:10px;background:#edf7ef;border:1px solid #c6decf;color:#2c6a3e;border-radius:16px;padding:6px 10px;font-size:10px;font-weight:800}@media(max-width:600px){.hero h1{font-size:25px}.wrap{padding:10px}.cover{height:145px}.trip-name{font-size:18px}}
</style>
</head>
<body>
<header class="hero"><h1>✈️ My Trips</h1><p>旅行中心・所有行程共用同一套 App Engine</p></header>
<main class="wrap"><div class="bar"><h2>我的旅程</h2><span class="count" id="tripCount">載入中…</span></div><div class="trip-grid" id="tripGrid"></div><div class="status" id="tripStatus">正在載入旅程資料…</div></main>
<div class="version" id="homeVersion">v10.9.0</div><div class="footer">Multi Trip App｜共用頁面＋獨立 Trip Data＋可選專用 Module</div>
<script>
(function(){
 const fallback={id:'shirakawago-shinhotaka-2027',name:'白川鄉・新穗高之旅 2027',shortName:'白川鄉・新穗高 2027',subtitle:'日本中部冬季自駕・9日8夜',startDate:'2027-01-09',endDate:'2027-01-17',country:'日本',emoji:'🇯🇵',cover:'assets/images/d7-shirakawago-view.jpg',entry:'itinerary.html',status:'active',badge:'正式旅程',features:{itinerary:true,tripInfo:true,attractions:true,liveCam:true}};
 const grid=document.getElementById('tripGrid'),count=document.getElementById('tripCount'),status=document.getElementById('tripStatus');
 const active=localStorage.getItem('multiTrip.activeTrip')||'';
 function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c));}
 function fmt(s){if(!s)return'';const p=s.split('-');return p.length===3?p[0]+'/'+p[1]+'/'+p[2]:s;}
 function url(file,id){return file+'?trip='+encodeURIComponent(id);}
 function link(label,file,t,secondary){return '<a class="open-btn'+(secondary?' secondary':'')+'" href="'+url(file,t.id)+'" data-trip="'+esc(t.id)+'">'+label+'</a>';}
 function card(t){
  const f=t.features||{},isTest=t.status==='test',isCurrent=active===t.id;
  const el=document.createElement('article');el.className='trip-card'+(isCurrent?' active-trip':'');
  const cover=t.cover?"background-image:url('"+esc(t.cover)+"')":'';
  let actions='';if(f.itinerary!==false)actions+=link('🗓️ 開啟行程',t.entry||'itinerary.html',t,false);if(f.tripInfo!==false)actions+=link('🧳 旅程資料','trip-info.html',t,true);if(f.attractions!==false)actions+=link('🗾 景點','attractions.html',t,true);if(f.liveCam!==false)actions+=link('📹 Live Cam','live.html',t,true);
  el.innerHTML='<div class="cover" style="'+cover+'"><div class="country">'+esc(t.emoji||'✈️')+' '+esc(t.country||'')+'</div><div class="trip-badges"><span class="badge '+(isTest?'test':'')+'">'+esc(t.badge||(isTest?'測試':'旅程'))+'</span>'+(isCurrent?'<span class="badge current">上次使用</span>':'')+'</div></div><div class="trip-body"><div class="trip-name">'+esc(t.name)+'</div><div class="trip-sub">'+esc(t.subtitle||'')+'</div><div class="trip-date">📅 '+esc(fmt(t.startDate))+' – '+esc(fmt(t.endDate))+'</div>'+(isTest?'<div class="trip-note">🧪 呢個係架構驗證 Trip，資料唔代表真實預訂；用嚟測試第二套行程係咪完全由共用 Renderer 生成。</div>':'')+'<div class="actions">'+actions+'</div></div>';
  el.querySelectorAll('[data-trip]').forEach(x=>x.addEventListener('click',()=>{try{localStorage.setItem('multiTrip.activeTrip',t.id);}catch(e){}}));return el;
 }
 function render(trips){grid.innerHTML='';trips.forEach(t=>grid.appendChild(card(t)));count.textContent=trips.length+' 個旅程';status.innerHTML=trips.some(t=>t.status==='test')?'✅ Multi Trip Selector 已啟用。<strong>正式旅程</strong>同<strong>架構測試 Trip</strong>共用同一套 HTML／Weather／Today／Driving Engine；測試 Trip 唔會改動你正式日本行程資料。':'選擇一個旅程開始。';}
 fetch('trips/registry.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json();}).then(x=>render((x.trips||[]).filter(t=>t.status!=='hidden'))).catch(()=>{render([fallback]);status.textContent='目前離線，顯示已內置旅程。';});
 fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(v=>{if(v&&v.version)document.getElementById('homeVersion').textContent=v.version;}).catch(()=>{});
})();
</script>
</body></html>
