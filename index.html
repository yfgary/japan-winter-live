    <title>Japan Winter 2027 Live Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #eef2f6;
            color: #222;
            font-family: Arial, "Microsoft JhengHei", "Noto Sans TC", sans-serif;
        }

        header {
            background: linear-gradient(135deg, #163a5c, #28689d);
            color: white;
            text-align: center;
            padding: 20px 12px;
        }

        header h1 {
            margin: 0;
            font-size: 27px;
        }

        header p {
            margin: 7px 0 0;
            opacity: .9;
        }

        .quick-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255,255,255,.96);
            border-bottom: 1px solid #d6dee5;
            box-shadow: 0 2px 7px rgba(0,0,0,.06);
        }

        .quick-nav-inner {
            max-width: 1250px;
            margin: auto;
            padding: 8px 10px;
            display: flex;
            gap: 7px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .nav-btn {
            border: 0;
            background: #eaf2f8;
            color: #1f4e79;
            text-decoration: none;
            border-radius: 18px;
            padding: 7px 11px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        .nav-btn:hover {
            background: #d5e7f3;
        }

        .nav-btn.dark {
            background: #1f4e79;
            color: white;
        }

        .container {
            max-width: 1250px;
            margin: auto;
            padding: 16px;
        }

        .notice {
            background: #fff8df;
            border: 1px solid #f0dda1;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 15px;
            font-size: 14px;
            line-height: 1.55;
        }

        details.region {
            background: white;
            border-radius: 13px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,.07);
            overflow: hidden;
            scroll-margin-top: 65px;
        }

        details.region > summary {
            list-style: none;
            cursor: pointer;
            padding: 17px 19px;
            display: flex;
            align-items: center;
            gap: 12px;
            user-select: none;
        }

        details.region > summary::-webkit-details-marker {
            display: none;
        }

        .summary-main {
            min-width: 0;
            flex: 1;
        }

        .summary-title {
            font-size: 21px;
            font-weight: 700;
        }

        .summary-desc {
            margin-top: 4px;
            color: #687580;
            font-size: 13px;
        }

        .count {
            flex-shrink: 0;
            padding: 5px 9px;
            border-radius: 15px;
            background: #eaf2f8;
            color: #1f4e79;
            font-size: 11px;
            font-weight: 700;
        }

        details.region > summary::after {
            content: "＋";
            color: #1f4e79;
            font-size: 24px;
            font-weight: bold;
        }

        details.region[open] > summary::after {
            content: "−";
        }

        details.region[open] > summary {
            border-bottom: 1px solid #e4eaef;
        }

        .region-body {
            padding: 17px;
        }

        .cam-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .cam-card {
            min-width: 0;
            background: #f6f8fa;
            border-radius: 11px;
            padding: 13px;
        }

        .cam-top {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin-bottom: 9px;
        }

        .cam-text {
            min-width: 0;
            flex: 1;
        }

        .cam-card h3 {
            margin: 0;
            font-size: 16px;
            line-height: 1.3;
        }

        .cam-card p {
            margin: 5px 0 0;
            color: #65727c;
            font-size: 12px;
            line-height: 1.4;
        }

        .badge {
            flex-shrink: 0;
            padding: 4px 7px;
            border-radius: 12px;
            font-size: 9px;
            font-weight: 700;
        }

        .badge-video {
            background: #e5f3e9;
            color: #25713c;
        }

        .badge-road {
            background: #fff0d2;
            color: #856000;
        }

        .media-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 9px;
            background: #172029;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .media-status {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 15px;
            color: #bbc6ce;
            font-size: 12px;
        }

        .media-box.loaded .media-status {
            display: none;
        }

        iframe.live-video {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            border: 0;
            background: #000;
        }

        img.live-img {
            position: relative;
            z-index: 2;
            display: none;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #111;
        }

        .media-box.loaded img.live-img {
            display: block;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 9px;
        }

        .button {
            display: inline-block;
            border: 0;
            border-radius: 7px;
            padding: 7px 10px;
            background: #1f4e79;
            color: white;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .button.secondary {
            background: #647786;
        }

        .official-links {
            margin-top: 16px;
            padding-top: 13px;
            border-top: 1px solid #e2e8ed;
        }

        .official-links-title {
            margin-bottom: 8px;
            color: #64727d;
            font-size: 12px;
            font-weight: 700;
        }

        .link-row {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .small-link {
            display: inline-block;
            text-decoration: none;
            background: #edf3f7;
            color: #28577c;
            border: 1px solid #d6e1e9;
            border-radius: 17px;
            padding: 7px 11px;
            font-size: 12px;
            font-weight: 600;
        }

        .small-link:hover {
            background: #dfeaf2;
        }

        footer {
            text-align: center;
            color: #7a8791;
            font-size: 12px;
            padding: 15px 10px 35px;
        }

        @media (max-width: 720px) {
            .container {
                padding: 9px;
            }

            header h1 {
                font-size: 22px;
            }

            .cam-grid {
                grid-template-columns: 1fr;
            }

            details.region > summary {
                padding: 14px;
            }

            .summary-title {
                font-size: 18px;
            }

            .summary-desc {
                display: none;
            }

            .region-body {
                padding: 11px;
            }
        }
    </style>
</head>

/* =========================================================
   Rendering
========================================================= */

function youtubeEmbed(id) {
    return (
        "https://www.youtube-nocookie.com/embed/" +
        encodeURIComponent(id) +
        "?autoplay=1&mute=1&controls=0&rel=0&playsinline=1"
    );
}

function cacheBust(url) {
    return url + (url.includes("?") ? "&" : "?") + "t=" + Date.now();
}

function renderCam(cam) {

    if (cam.type === "youtube") {

        return `
        <div class="cam-card">

            <div class="cam-top">

                <div class="cam-text">
                    <h3>${cam.name}</h3>
                    ${cam.desc ? `<p>${cam.desc}</p>` : ""}
                </div>

                <span class="badge badge-video">
                    LIVE VIDEO
                </span>

            </div>

            <div class="media-box">

                <div class="media-status">
                    展開地區後載入 Live Camera…
                </div>

                <iframe
                    class="live-video"
                    data-src="${youtubeEmbed(cam.id)}"
                    title="${cam.name}"
                    allow="autoplay; encrypted-media; picture-in-picture"
                    allowfullscreen>
                </iframe>

            </div>

            <div class="actions">

                <a
                    class="button"
                    href="https://www.youtube.com/watch?v=${cam.id}"
                    target="_blank"
                    rel="noopener">
                    🔗 全螢幕
                </a>

            </div>

        </div>
        `;
    }


    if (cam.type === "image") {

        return `
        <div class="cam-card">

            <div class="cam-top">

                <div class="cam-text">
                    <h3>${cam.name}</h3>
                    ${cam.desc ? `<p>${cam.desc}</p>` : ""}
                </div>

                <span class="badge badge-road">
                    ROAD CAM
                </span>

            </div>

            <div class="media-box">

                <div class="media-status">
                    展開地區後載入最新道路圖片…
                </div>

                <img
                    class="live-img"
                    data-src="${cam.url}"
                    alt="${cam.name}">
            </div>

            <div class="actions">

                ${
                    cam.source
                    ?
                    `<a
                        class="button secondary"
                        href="${cam.source}"
                        target="_blank"
                        rel="noopener">
                        🛣️ 官方來源
                    </a>`
                    :
                    ""
                }

            </div>

        </div>
        `;
    }

    return "";
}


function renderSection(section) {

    return `
    <details
        class="region"
        id="${section.id}">

        <summary>

            <div class="summary-main">

                <div class="summary-title">
                    ${section.title}
                </div>

                <div class="summary-desc">
                    ${section.desc}
                </div>

            </div>

            <span class="count">
                ${section.cams.length} 個可直接睇
            </span>

        </summary>


        <div class="region-body">

            <div class="cam-grid">

                ${section.cams.map(renderCam).join("")}

            </div>


            ${
                section.links && section.links.length
                ?
                `
                <div class="official-links">

                    <div class="official-links-title">
                        官方／其他實用入口
                    </div>

                    <div class="link-row">

                        ${section.links.map(link => `
                            <a
                                class="small-link"
                                href="${link.url}"
                                target="_blank"
                                rel="noopener">
                                ${link.name}
                            </a>
                        `).join("")}

                    </div>

                </div>
                `
                :
                ""
            }

        </div>

    </details>
    `;
}


document.getElementById("app").innerHTML =
    sections.map(renderSection).join("");


/* =========================================================
   Navigation
========================================================= */

const quickNav = document.getElementById("quickNav");

sections.forEach(section => {

    const a = document.createElement("a");

    a.className = "nav-btn";

    a.href = "#" + section.id;

    a.textContent = section.nav;

    a.addEventListener("click", function(e) {

        e.preventDefault();

        const target =
            document.getElementById(section.id);

        target.open = true;

        loadSection(target);

        setTimeout(() => {
            target.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });
        }, 50);

    });

    quickNav.appendChild(a);
});


/* =========================================================
   Load / Stop Media
========================================================= */

function loadSection(details) {

    details
        .querySelectorAll("iframe.live-video")
        .forEach(frame => {

            if (!frame.hasAttribute("src")) {

                frame.src =
                    frame.dataset.src;

                frame.addEventListener(
                    "load",
                    () => {
                        frame
                            .closest(".media-box")
                            .classList.add("loaded");
                    },
                    { once: true }
                );
            }

        });


    details
        .querySelectorAll("img.live-img")
        .forEach(img => {

            loadImage(img);

        });

}


function stopSection(details) {

    details
        .querySelectorAll("iframe.live-video")
        .forEach(frame => {

            frame.removeAttribute("src");

            frame
                .closest(".media-box")
                .classList.remove("loaded");

        });

}


function loadImage(img) {

    const box =
        img.closest(".media-box");

    box.classList.remove("loaded");

    img.onload = function() {

        box.classList.add("loaded");

        const status =
            box.querySelector(".media-status");

        status.textContent = "";

    };


    img.onerror = function() {

        box.classList.remove("loaded");

        const status =
            box.querySelector(".media-status");

        status.innerHTML =
            "⚠️ 暫時未能讀取圖片<br>請用下面「官方來源」查看";

    };


    img.src =
        cacheBust(img.dataset.src);

}


/* =========================================================
   Details Toggle
========================================================= */

document
    .querySelectorAll("details.region")
    .forEach(details => {

        details.addEventListener(
            "toggle",
            function() {

                if (this.open) {
                    loadSection(this);
                }
                else {
                    stopSection(this);
                }

            }
        );

    });


/* =========================================================
   Controls
========================================================= */

document
    .getElementById("closeAll")
    .addEventListener(
        "click",
        function() {

            document
                .querySelectorAll("details.region")
                .forEach(details => {
                    details.open = false;
                });

        }
    );


document
    .getElementById("refreshImages")
    .addEventListener(
        "click",
        function() {

            document
                .querySelectorAll(
                    "details.region[open] img.live-img"
                )
                .forEach(loadImage);

        }
    );


/* =========================================================
   Auto refresh OPEN road cams every 10 minutes
========================================================= */

setInterval(
    function() {

        document
            .querySelectorAll(
                "details.region[open] img.live-img"
            )
            .forEach(loadImage);

    },
    10 * 60 * 1000
);


/* =========================================================
   Open hash section if URL has #section
========================================================= */

window.addEventListener(
    "load",
    function() {

        if (location.hash) {

            const target =
                document.querySelector(location.hash);

            if (
                target &&
                target.matches("details.region")
            ) {

                target.open = true;

                loadSection(target);

            }

        }

    }
);

</script>
