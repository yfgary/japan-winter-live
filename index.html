<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0b5fa8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TravelPilot">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/jpeg" href="assets/images/travelpilot-icon-exact.jpg?v=10.10.12">
<link rel="apple-touch-icon" href="assets/images/travelpilot-icon-exact.jpg?v=10.10.12">
<meta name="description" content="TravelPilot 旅程管家：集中管理所有旅程、行程、景點、天氣、自駕、Live Cam、旅遊資料與出發 Checklist。">
<title>TravelPilot｜旅程管家</title>
<style>
:root{--blue:#0b6db7;--deep:#123c6b;--ink:#203548;--muted:#667b8b;--bg:#eef4f8}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Microsoft JhengHei","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased}.sitebar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-bottom:1px solid #dbe6ee;box-shadow:0 2px 12px rgba(18,65,103,.06)}.sitebar-inner{max-width:1200px;margin:auto;min-height:66px;padding:9px 18px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand-mini{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:900;color:#123b72;white-space:nowrap}.brand-mini img{width:42px;height:42px;border-radius:11px;object-fit:cover}.brand-mini span{font-size:19px}.topnav{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:flex-end}.topnav a{padding:9px 11px;border-radius:12px;text-decoration:none;font-size:13px;font-weight:800;color:#173c68}.topnav a:hover,.topnav a.active{background:#e7f3fc;color:#0875c9}.topnav .search{width:37px;height:37px;display:grid;place-items:center;border-radius:50%;background:#f0f7fc;font-size:18px}
.hero{width:100%;background:#dceefa}.hero img{display:block;width:100%;height:auto;max-height:none;object-fit:contain}.wrap{max-width:1200px;margin:0 auto;padding:18px}.section{background:#fff;border:1px solid #dce7ef;border-radius:18px;box-shadow:0 8px 26px rgba(28,76,112,.08);padding:16px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.section-head h2{margin:0;color:#174f7d;font-size:26px}.count{font-size:12px;color:#6a7a86;font-weight:800}.trip-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:15px}.trip-card{overflow:hidden;background:#fff;border-radius:17px;border:1px solid #dce8f0;box-shadow:0 7px 20px rgba(20,71,111,.08);position:relative}.trip-card.active-trip{outline:3px solid rgba(10,126,214,.2)}.cover{height:180px;background:linear-gradient(135deg,#dbe7ef,#b8cedd) center/cover no-repeat;position:relative}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 38%,rgba(3,24,47,.68))}.country{position:absolute;left:14px;bottom:12px;z-index:1;color:#fff;font-size:13px;font-weight:900}.trip-badges{position:absolute;top:10px;right:10px;z-index:2;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.badge{padding:6px 9px;border-radius:16px;font-size:10px;font-weight:900;background:rgba(255,255,255,.94);color:#1f4e79}.badge.test{background:#fff3c8;color:#715600}.badge.current{background:#e8f6eb;color:#2a6a3d}.trip-body{padding:15px}.trip-name{font-size:21px;font-weight:900;color:#174f7d;line-height:1.35}.trip-sub{margin-top:5px;color:#60717d;font-size:13px;line-height:1.5}.trip-date{margin-top:9px;font-size:12px;color:#526571;font-weight:800}.trip-note{margin-top:10px;padding:9px;border-radius:10px;background:#fff8df;color:#755900;font-size:11px;line-height:1.5}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.open-btn{border:0;border-radius:11px;background:linear-gradient(135deg,#1266ad,#0b94e7);color:#fff;padding:10px 13px;font-weight:900;text-decoration:none;font-size:12px;box-shadow:0 5px 13px rgba(19,105,173,.19)}.secondary{background:#eef5fa;color:#1f4e79;box-shadow:none}.status{margin-top:15px;padding:12px 14px;border-radius:12px;background:#f7fafc;color:#657987;font-size:12px;line-height:1.55;border:1px solid #e0ebf2}.footer{text-align:center;color:#7b8992;font-size:11px;padding:4px 10px 46px}
@media(max-width:900px){.topnav a{display:none}.topnav .search{display:grid}}
@media(max-width:600px){.sitebar-inner{min-height:58px;padding:8px 12px}.brand-mini img{width:38px;height:38px;border-radius:10px}.brand-mini span{font-size:16px}.wrap{padding:10px}.section{padding:11px;border-radius:15px}.section-head h2{font-size:22px}.trip-grid{grid-template-columns:1fr}.cover{height:155px}.trip-name{font-size:18px}}
</style>
</head>
<body>
<nav class="sitebar"><div class="sitebar-inner"><a class="brand-mini" href="index.html"><img src="assets/images/travelpilot-icon-exact.jpg?v=10.10.12" alt=""><span>TravelPilot 旅程管家</span></a><div class="topnav"><a class="active" href="index.html">🏠 首頁</a><a href="itinerary.html">🗓 行程</a><a href="attractions.html">📍 景點</a><a href="itinerary.html#weather">🌦 天氣</a><a href="itinerary.html">🚗 自駕</a><a href="live.html">📷 Live Cam</a><a href="trip-info.html">🧳 旅遊資料</a><a class="search" href="#trips" aria-label="旅程">⌕</a></div></div></nav>
<header class="hero"><img src="assets/images/travelpilot-banner-web.jpg?v=10.10.12" alt="TravelPilot 旅程管家"></header>
<main class="wrap"><section class="section" id="trips"><div class="section-head"><h2>我的旅程</h2><span class="count" id="tripCount">載入中…</span></div><div class="trip-grid" id="tripGrid"></div><div class="status" id="tripStatus">正在載入旅程資料…</div></section></main>
<div class="footer">TravelPilot｜旅程管家・你的旅程資料、行程工具與即時資訊集中管理</div>
<script src="assets/multi-trip-context-v1.js?v=10.10.12"></script>
<script>
(function(){
 const fallback={id:'shirakawago-shinhotaka-2027',name:'白川鄉・新穗高之旅 2027',shortName:'白川鄉・新穗高 2027',subtitle:'日本中部冬季自駕・9日8夜',startDate:'2027-01-09',endDate:'2027-01-17',country:'日本',emoji:'🇯🇵',cover:'assets/images/d7-shirakawago-view.jpg',entry:'itinerary.html',status:'active',badge:'正式旅程',features:{itinerary:true,tripInfo:true,attractions:true,liveCam:true}};
 const grid=document.getElementById('tripGrid'),count=document.getElementById('tripCount'),status=document.getElementById('tripStatus');
 const active=localStorage.getItem('multiTrip.activeTrip')||'';
 function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c));}
 function fmt(s){if(!s)return'';const p=s.split('-');return p.length===3?p[0]+'/'+p[1]+'/'+p[2]:s;}
 function url(file,id){return file+'?trip='+encodeURIComponent(id);}
 function link(label,file,t,secondary){return '<a class="open-btn'+(secondary?' secondary':'')+'" href="'+url(file,t.id)+'" data-trip="'+esc(t.id)+'">'+label+'</a>';}
 function card(t){const f=t.features||{},isTest=t.status==='test',isCurrent=active===t.id;const el=document.createElement('article');el.className='trip-card'+(isCurrent?' active-trip':'');const cover=t.cover?"background-image:url('"+esc(t.cover)+"')":'';let actions='';if(f.itinerary!==false)actions+=link('▶ 開啟行程',t.entry||'itinerary.html',t,false);if(f.tripInfo!==false)actions+=link('🧳 旅程資料','trip-info.html',t,true);if(f.attractions!==false)actions+=link('📍 景點','attractions.html',t,true);if(f.liveCam!==false)actions+=link('📷 Live Cam','live.html',t,true);el.innerHTML='<div class="cover" style="'+cover+'"><div class="country">'+esc(t.emoji||'✈️')+' '+esc(t.country||'')+'</div><div class="trip-badges"><span class="badge '+(isTest?'test':'')+'">'+esc(t.badge||(isTest?'測試':'旅程'))+'</span>'+(isCurrent?'<span class="badge current">上次使用</span>':'')+'</div></div><div class="trip-body"><div class="trip-name">'+esc(t.name)+'</div><div class="trip-sub">'+esc(t.subtitle||'')+'</div><div class="trip-date">📅 '+esc(fmt(t.startDate))+' – '+esc(fmt(t.endDate))+'</div>'+(isTest?'<div class="trip-note">🧪 呢個係架構驗證 Trip，資料唔代表真實預訂；用嚟測試第二套行程係咪完全由共用 Renderer 生成。</div>':'')+'<div class="actions">'+actions+'</div></div>';el.querySelectorAll('[data-trip]').forEach(x=>x.addEventListener('click',()=>{try{localStorage.setItem('multiTrip.activeTrip',t.id);}catch(e){}}));return el;}
 function render(trips){trips=[...trips].sort((a,b)=>String(b.startDate||'').localeCompare(String(a.startDate||'')));grid.innerHTML='';trips.forEach(t=>grid.appendChild(card(t)));count.textContent=trips.length+' 個旅程';status.innerHTML=trips.some(t=>t.status==='test')?'✅ TravelPilot 已啟用。<strong>正式旅程</strong>同<strong>架構測試 Trip</strong>共用同一套核心功能；各 Trip 資料互相獨立。':'選擇一個旅程開始。';}
 fetch('trips/registry.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json();}).then(x=>render((x.trips||[]).filter(t=>t.status!=='hidden'))).catch(()=>{render([fallback]);status.textContent='目前離線，顯示已內置旅程。';});
})();
</script>
</body></html>
