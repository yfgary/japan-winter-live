name: Auto Apply Attraction Assets

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Link attraction assets
        run: python3 scripts/apply-attraction-assets.py

      - name: Commit site update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add itinerary.html trip-info.html sw.js
          if git diff --cached --quiet; then
            echo "No site changes"
            exit 0
          fi
          git commit -m "Add detailed attraction info and hotel payment status"
          git push
