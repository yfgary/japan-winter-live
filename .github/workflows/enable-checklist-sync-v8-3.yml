name: Enable Checklist Sync v8.3

on:
  push:
    paths:
      - ".github/workflows/enable-checklist-sync-v8-3.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch site
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('assets/trip-user-overrides.js'); s=p.read_text(encoding='utf-8'); loader='\n\n/* Cross-device departure checklist sync */\n(function(){\n  if(document.getElementById(\"checklistSyncScript\")) return;\n  const s=document.createElement(\"script\");\n  s.id=\"checklistSyncScript\";\n  s.src=\"assets/checklist-sync.js?v=1\";\n  s.defer=true;\n  document.head.appendChild(s);\n})();\n'; p.write_text(s if 'checklistSyncScript' in s else s+loader,encoding='utf-8')"
          python3 -c "from pathlib import Path; import re; p=Path('assets/site-shell-v7.js'); s=p.read_text(encoding='utf-8'); s=re.sub(r\"const INSTALLED_VERSION = 'v[^']+';\",\"const INSTALLED_VERSION = 'v8.3';\",s,count=1); p.write_text(s,encoding='utf-8')"
          python3 -c "from pathlib import Path; import re; p=Path('sw.js'); s=p.read_text(encoding='utf-8'); s=re.sub(r'const CACHE_NAME = \"japan-winter-2027-v[^\"]+\";','const CACHE_NAME = \"japan-winter-2027-v8.3\";',s,count=1); a='    \"./assets/trip-user-overrides.js\",\\n'; s=s if '\"./assets/checklist-sync.js\"' in s else s.replace(a,a+'    \"./assets/checklist-sync.js\",\\n',1); p.write_text(s,encoding='utf-8')"
          printf '%s\n' '{' '  "version": "v8.3",' '  "build": "2026-09-27.5",' '  "updated": "2026-09-27T22:30:00+08:00",' '  "notes": "Cross-device checklist sync via Supabase"' '}' > version.json
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/trip-user-overrides.js assets/site-shell-v7.js assets/checklist-sync.js sw.js version.json
          git rm .github/workflows/enable-checklist-sync-v8-3.yml
          git commit -m "Enable cross-device checklist sync v8.3"
          git push
