name: Apply v8.6 Weather and Itinerary

on:
  push:
    paths:
      - ".github/workflows/apply-v8-6-weather-d1-d9.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/apply_v86.py

      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-v8-6-weather-d1-d9.yml scripts/apply_v86.py
          git add assets/site-shell-v7.js assets/trip-user-overrides.js sw.js version.json
          git commit -m "Add feels-like weather and airport itinerary details v8.6"
          git push
