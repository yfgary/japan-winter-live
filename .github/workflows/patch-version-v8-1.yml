name: Patch installed version to v8.1
on:
  push:
    paths:
      - '.github/workflows/patch-version-v8-1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch version and remove workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/site-shell-v7.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const INSTALLED_VERSION = 'v8.0';","const INSTALLED_VERSION = 'v8.1';",1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site-shell-v7.js
          git rm .github/workflows/patch-version-v8-1.yml
          git commit -m "Set installed site version to v8.1"
          git push
