name: TravelPilot QA

on:
  pull_request:
  push:
    branches:
      - main
      - qa-cleanup-v10.12.0

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run static QA
        run: python scripts/qa.py
