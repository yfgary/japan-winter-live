name: TravelPilot QA

on:
  pull_request:
  push:
    branches:
      - main
      - qa-cleanup-v10.12.0

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run static QA
        run: python scripts/qa.py
      - name: Run checklist migration QA
        run: python scripts/qa_checklist.py
      - name: Run observer regression QA
        run: python scripts/qa_observers.py
      - name: Check JavaScript syntax
        run: |
          node --check sw.js
          find assets -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
