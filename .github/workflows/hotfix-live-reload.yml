name: Hotfix Live Reload Prompt

on:
  push:
    branches:
      - hotfix-v10.13.3-live-reload-prompt

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: hotfix-v10.13.3-live-reload-prompt
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply hotfix
        run: python scripts/hotfix_live_reload_prompt.py
      - name: Verify hotfix
        run: |
          git diff --check
          python scripts/qa_release.py
          python scripts/qa.py
          python scripts/qa_checklist.py
          python scripts/qa_observers.py
          python scripts/qa_legacy_update.py
          python scripts/qa_loader.py
          node --check sw.js
          find assets -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live.html assets/multi-trip-live-entry-v1.js assets/multi-trip-context-v1.js assets/attraction-info.js index.html manifest.webmanifest sw.js version.json scripts/qa_legacy_update.py scripts/qa_release.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: remove persistent Live Cam reload prompt [live-reload-hotfix-applied]'
          git push origin HEAD:hotfix-v10.13.3-live-reload-prompt
