name: Patch site shell to v8
on:
  push:
    paths:
      - '.github/workflows/patch-shell-v8.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch installed version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/site-shell-v7.js')
          s=p.read_text(encoding='utf-8')
          old="const INSTALLED_VERSION = 'v7.0';"
          new="const INSTALLED_VERSION = 'v8.0';"
          if old not in s:
              if new in s:
                  print('Already v8.0')
              else:
                  raise SystemExit('version target not found')
          else:
              p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site-shell-v7.js
          git commit -m "Set installed site version to v8.0"
          git push
