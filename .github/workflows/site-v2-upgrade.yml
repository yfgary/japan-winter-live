          COMMON_JS = r'''
<script id="tripv2-common-script">
(function(){
    if (window.__tripV2CommonLoaded) return;
    window.__tripV2CommonLoaded = true;

    function ensureNetworkStatus(){
        let el = document.getElementById('tripv2NetworkStatus');
        if (!el) {
            el = document.createElement('div');
            el.id = 'tripv2NetworkStatus';
            el.className = 'tripv2-status';
            document.body.appendChild(el);
        }
        function refresh(){
            const online = navigator.onLine;
            el.textContent = online ? '🟢 Online' : '🟠 Offline';
            el.classList.toggle('offline', !online);
            el.title = online ? 'Live Cam / Google Maps 可正常使用' : 'Offline：行程可睇，但 Live Cam / Google Maps 需要網絡';
        }
        window.addEventListener('online', refresh);
        window.addEventListener('offline', refresh);
        refresh();
    }

    function ensureUpdatePrompt(){
        if (!('serviceWorker' in navigator)) return;

        let box = document.getElementById('tripv2UpdatePrompt');
        if (!box) {
            box = document.createElement('div');
            box.id = 'tripv2UpdatePrompt';
            box.className = 'tripv2-update';
            box.innerHTML = '<span id="tripv2UpdateText">🔄 有新版網站</span><button type="button" id="tripv2ReloadBtn">重新載入</button>';
            document.body.appendChild(box);
            document.getElementById('tripv2ReloadBtn').addEventListener('click', function(){ location.reload(); });
        }

        function show(text){
            const t = document.getElementById('tripv2UpdateText');
            if (t) t.textContent = text;
            box.classList.add('show');
        }

        navigator.serviceWorker.getRegistration().then(function(reg){
            if (!reg) return;
            if (reg.waiting) show('🔄 有新版網站');
            reg.addEventListener('updatefound', function(){
                const worker = reg.installing;
                if (!worker) return;
                worker.addEventListener('statechange', function(){
                    if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                        show('🔄 有新版網站');
                    }
                });
            });
            reg.update().catch(function(){});
        }).catch(function(){});

        navigator.serviceWorker.addEventListener('controllerchange', function(){
            show('✅ 新版已準備好');
        });
    }

    document.addEventListener('DOMContentLoaded', function(){
        ensureNetworkStatus();
        ensureUpdatePrompt();
    });
})();
</script>
'''

