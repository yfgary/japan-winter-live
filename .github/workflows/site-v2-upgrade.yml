          INFO_JS = r'''
<script id="tripv2-info-script">
(function(){
    const CHECK_KEY='japanWinter2027_checklist_v1';
    const WEATHER_KEY='japanWinter2027_shinhotakaDay';

    function setupChecklist(){
        const wrap=document.querySelector('#checklist .checklist'); if(!wrap) return;
        let state={}; try{ state=JSON.parse(localStorage.getItem(CHECK_KEY)||'{}'); }catch(e){}
        wrap.querySelectorAll('.check-item').forEach((item,idx)=>{
            if(item.querySelector('input')) return;
            const text=item.textContent.trim();
            const key='i'+idx;
            const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=!!state[key];
            item.prepend(cb); item.classList.toggle('done',cb.checked);
            function save(){ state[key]=cb.checked; localStorage.setItem(CHECK_KEY,JSON.stringify(state)); item.classList.toggle('done',cb.checked); }
            cb.addEventListener('change',save);
            item.addEventListener('click',function(e){ if(e.target===cb) return; cb.checked=!cb.checked; save(); });
        });
        if(!document.getElementById('tripv2ResetChecklist')){
            const b=document.createElement('button'); b.id='tripv2ResetChecklist'; b.className='tripv2-reset-check'; b.textContent='↺ 全部 Checklist 重設';
            b.addEventListener('click',function(){ localStorage.removeItem(CHECK_KEY); wrap.querySelectorAll('input').forEach(c=>{c.checked=false;c.dispatchEvent(new Event('change'));}); });
            wrap.insertAdjacentElement('afterend',b);
        }
    }

    function setupWeatherSummary(){
        const sec=document.getElementById('weather'); if(!sec) return;
        const body=sec.querySelector('.section-body'); if(!body) return;
        let box=document.getElementById('tripv2WeatherSummary'); if(!box){ box=document.createElement('div'); box.id='tripv2WeatherSummary'; box.className='tripv2-weather-summary'; body.prepend(box); }
        const sh=localStorage.getItem(WEATHER_KEY);
        const label=sh==='d6'?'D6':sh==='d7'?'D7':sh==='d8'?'D8':null;
        if(!label){ box.innerHTML='🌨️ <strong>D6–D8 尚未鎖定。</strong> 去「詳細行程」揀 D6／D7／D8 邊日去新穗高。'; return; }
        let d6=sh==='d6'?'新穗高':'高山市區＋飛驒大鐘乳洞';
        let d7=sh==='d7'?'新穗高':'白川鄉';
        let d8=sh==='d8'?'新穗高':(sh==='d7'?'白川鄉':'高山市區＋飛驒大鐘乳洞');
        box.innerHTML='🚡 <strong>'+label+' 去新穗高</strong><br>D6：'+d6+'<br>D7：'+d7+'<br>D8：'+d8+' → 松本';
    }

    document.addEventListener('DOMContentLoaded',function(){ setupChecklist(); setupWeatherSummary(); });
})();
</script>
'''

          def inject(path, css_blocks, js_blocks):
              p=Path(path); s=p.read_text(encoding='utf-8')
              for marker, css in css_blocks:
                  if marker not in s:
                      s=s.replace('</style>', css+'\n</style>',1)
              for marker, js in js_blocks:
                  if marker not in s:
                      s=s.replace('</body>', js+'\n</body>',1)
              p.write_text(s,encoding='utf-8')

          inject('index.html', [('TRIP V2 COMMON',COMMON_CSS),('TRIP V2 TODAY CARD',INDEX_CSS)], [('tripv2-common-script',COMMON_JS),('tripv2-index-script',INDEX_JS)])
          inject('itinerary.html', [('TRIP V2 COMMON',COMMON_CSS),('TRIP V2 D6-D8 SELECTOR',ITIN_CSS)], [('tripv2-common-script',COMMON_JS),('tripv2-itinerary-script',ITIN_JS)])
          inject('trip-info.html', [('TRIP V2 COMMON',COMMON_CSS),('TRIP V2 CHECKLIST',INFO_CSS)], [('tripv2-common-script',COMMON_JS),('tripv2-info-script',INFO_JS)])

          p=Path('sw.js'); s=p.read_text(encoding='utf-8')
          s=s.replace('japan-winter-2027-v2','japan-winter-2027-v3')
          p.write_text(s,encoding='utf-8')

          print('Site V2 upgrade applied')
          PY

      - name: Commit upgrade and clean temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/test-sync.yml
          rm -f .github/workflows/apply-trip-update.yml
          rm -f .github/workflows/site-v2-upgrade.yml
          git add index.html itinerary.html trip-info.html sw.js .github/workflows
          git commit -m "Add travel day tools and simplify D6-D8 planning"
          git push
          git push origin --delete tmp-check || true
