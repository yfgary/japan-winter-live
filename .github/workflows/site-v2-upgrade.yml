        if(day==='d6') return 'tak';
        if(day==='d7') return 'shir';
        if(day==='d8') return sh==='d6' ? 'tak' : 'shir';
        return 'tak';
    }

    function selector(){
        if(document.getElementById('tripv2WeatherSelect')) return;
        const intro=document.querySelector('.intro'); if(!intro) return;
        const box=document.createElement('section'); box.id='tripv2WeatherSelect'; box.className='tripv2-weather-select';
        box.innerHTML='<h2>🌨️ D6–D8 新穗高日子</h2><p>只需要揀「邊一日去新穗高」。揀完之後 D6–D8 只會顯示實際要行嘅一條行程，唔再同時見 Plan A／B／C。</p><div class="tripv2-choice-row"><button class="tripv2-choice" data-sh="d6">🚡 D6 去新穗高</button><button class="tripv2-choice" data-sh="d7">🚡 D7 去新穗高</button><button class="tripv2-choice" data-sh="d8">🚡 D8 去新穗高</button><button class="tripv2-choice reset" data-sh="">重設</button></div>';
        intro.insertAdjacentElement('afterend',box);
        box.querySelectorAll('[data-sh]').forEach(btn=>btn.addEventListener('click',function(){
            const v=this.dataset.sh; if(v) localStorage.setItem(KEY,v); else localStorage.removeItem(KEY); render();
        }));
    }

    function renderDay(id, sh){
        const day=document.getElementById(id); if(!day) return;
        day.querySelectorAll('.day-highlights,.quick-decision,.day-content').forEach(el=>el.classList.add('tripv2-hidden-original'));
        let panel=day.querySelector('.tripv2-selected-plan'); if(panel) panel.remove();
        panel=document.createElement('div'); panel.className='tripv2-selected-plan';
        if(!sh){
            panel.innerHTML='<h3>🌨️ 未選新穗高日子</h3><div class="route">請喺上面揀 D6／D7／D8 邊日去新穗高；之後呢度會自動變成單一路線。</div>';
        } else {
            const m=modeFor(id,sh), p=plans[id][m];
            panel.innerHTML='<h3>'+p.title+'</h3><div class="route">'+p.route+'</div><div class="tripv2-plan-list">'+p.items.map(i=>'<div class="tripv2-plan-item"><strong>'+i[0]+'</strong>　'+i[1]+'<br><a class="tripv2-plan-map" href="'+mapUrl(i[2])+'" target="_blank" rel="noopener">📍 Google Maps</a></div>').join('')+'</div>'+(id==='d7'&&m==='shir'?'<div class="tripv2-plan-item" style="margin-top:8px">⭐ 返到高山夠早＋道路安全，先考慮飛驒古川三寺巡禮 Bonus。</div>':'');
        }
        const photo=day.querySelector('.photo-section');
        if(photo) photo.insertAdjacentElement('afterend',panel); else day.querySelector('.day-inner').appendChild(panel);
    }

    function render(){
        const sh=localStorage.getItem(KEY);
        document.querySelectorAll('.tripv2-choice').forEach(b=>b.classList.toggle('active',b.dataset.sh===sh && !!sh));
        ['d6','d7','d8'].forEach(id=>renderDay(id,sh));
    }

    document.addEventListener('DOMContentLoaded',function(){ selector(); render(); });
})();
</script>
'''

