name: Site V2 Upgrade

on:
  push:
    paths:
      - ".github/workflows/site-v2-upgrade.yml"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Run upgrade payload from previous revision
        shell: bash
        run: |
          git show HEAD^:.github/workflows/site-v2-upgrade.yml > /tmp/site-v2-old.yml
          python3 - <<'PY'
          from pathlib import Path

          text = Path('/tmp/site-v2-old.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end_marker = "\n          PY\n\n      - name: Commit upgrade"
          end = text.index(end_marker, start)
          payload = text[start:end]

          fixed = []
          for line in payload.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              fixed.append(line)

          code = '\n'.join(fixed) + '\n'
          exec(compile(code, '/tmp/site-v2-payload.py', 'exec'), {})
          PY

      - name: Commit upgrade and clean temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/test-sync.yml
          rm -f .github/workflows/apply-trip-update.yml
          rm -f .github/workflows/site-v2-upgrade.yml
          git add index.html itinerary.html trip-info.html sw.js .github/workflows
          git commit -m "Add travel day tools and simplify D6-D8 planning"
          git push
          git push origin --delete tmp-check || true
