name: Apply Trip Update

on:
  push:
    paths:
      - ".github/workflows/apply-trip-update.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply updates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('itinerary.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Snow Monkey Park Kanbayashi Parking', '地獄谷野猿公苑専用駐車場')
          s = s.replace('data-map-label="上林 Snow Monkey 停車場"', 'data-map-label="地獄谷野猿公苑専用駐車場"')
          p.write_text(s, encoding='utf-8')

          p = Path('trip-info.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('data-map="上林ホテル仙壽閣 長野県山ノ内町"', 'data-map="地獄谷野猿公苑専用駐車場"')
          s = s.replace('data-map-label="地獄谷冬季停車場・導航 Hotel Senjukaku"', 'data-map-label="地獄谷野猿公苑専用駐車場"')
          s = s.replace('導航目標：上林ホテル仙壽閣', '導航目標：地獄谷野猿公苑専用駐車場')
          s = s.replace('Hotel Senjukaku 附近就係\n上林溫泉野猿公苑專用免費停車場。', 'Google Maps 正式名稱：\n地獄谷野猿公苑専用駐車場。')
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'href="trip-info.html"' not in s:
              old = '<a href="itinerary.html">\n    🗓️ 詳細行程\n</a>\n\n</div>'
              new = '<a href="itinerary.html">\n    🗓️ 詳細行程\n</a>\n\n<a href="trip-info.html">\n    🧳 旅程資料\n</a>\n\n</div>'
              if old not in s:
                  raise SystemExit('index page-switch anchor not found')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const CACHE_NAME = "japan-winter-2027-v1";', 'const CACHE_NAME = "japan-winter-2027-v2";')
          if '"./trip-info.html"' not in s:
              old = '    "./itinerary.html",\n'
              if old not in s:
                  raise SystemExit('sw itinerary cache entry not found')
              s = s.replace(old, old + '    "./trip-info.html",\n', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add itinerary.html trip-info.html index.html sw.js
          git rm -f .github/workflows/test-sync.yml .github/workflows/apply-trip-update.yml
          git commit -m "Sync trip navigation and offline cache"
          git push
