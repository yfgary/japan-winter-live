name: Validate v8 trip enhancements
on:
  push:
    paths:
      - '.github/workflows/validate-v8.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check assets/trip-v8-data.js
          node --check assets/trip-v8-ui.js
          node --check assets/attraction-info.js
          node --check assets/site-shell-v7.js
      - name: Validate attraction coverage and checklist
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          base=Path('assets/trip-enhancement-data.js').read_text(encoding='utf-8')
          v8=Path('assets/trip-v8-data.js').read_text(encoding='utf-8')
          # Attraction ids are declared before the backups/hotels section.
          attr_block=base.split('backups:',1)[0]
          ids=set(re.findall(r"\bid\s*:\s*'([^']+)'",attr_block))
          visit_block=v8.split('const visits = {',1)[1].split('};\n\nwindow.Japan2027V8',1)[0]
          visits=set(re.findall(r"^\s*'([^']+)'\s*:\s*\{",visit_block,re.M))
          missing=sorted(ids-visits)
          extra=sorted(visits-ids)
          print('Attraction IDs:',len(ids),'Visit entries:',len(visits))
          print('Missing:',missing)
          print('Extra:',extra)
          if missing:
              raise SystemExit('Missing visit metadata')
          checklist_ids=re.findall(r"\['(pack_[^']+)'\s*,",v8)
          print('Packing checklist items:',len(checklist_ids))
          if len(checklist_ids)<50:
              raise SystemExit('Packing checklist unexpectedly short')
          if len(checklist_ids)!=len(set(checklist_ids)):
              raise SystemExit('Duplicate packing checklist ids')
          PY
