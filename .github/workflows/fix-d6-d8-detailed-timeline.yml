name: Fix D6-D8 Detailed Timeline

on:
  push:
    paths:
      - ".github/workflows/fix-d6-d8-detailed-timeline.yml"
      - ".github/fix-d6-d8-payload.py"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply D6-D8 fix
        run: python3 .github/fix-d6-d8-payload.py
      - name: Commit fix and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/fix-d6-d8-payload.py
          git rm .github/workflows/fix-d6-d8-detailed-timeline.yml
          git add itinerary.html
          git commit -m "Restore detailed timelines for selected D6-D8 plans"
          git push
