                    ['highlight-road','🚗 大王山葵農場只係早到先加嘅 Bonus。']
                ],
                items: [
                    {time:'09:00', type:'🚗', title:'高山 → 新穗高', desc:'正常運行＋能見度值得先出發；冬季道路預鬆。', map:'新穂高温泉駐車場', mapLabel:'新穗高溫泉停車場'},
                    {time:'10:30', type:'🚡 核心景點', title:'新穗高纜車', desc:'今日係最後機會。如果仍然大霧／停駛，唔再追。', map:'新穂高温泉駐車場', mapLabel:'新穗高溫泉停車場', price:'成人約 ¥3,800'},
