    function modeFor(day, selectedShinhotakaDay){
        if (day === selectedShinhotakaDay) return 'sh';
        if (day === 'd6') return 'tak';
        if (day === 'd7') return 'shir';
        if (day === 'd8') return selectedShinhotakaDay === 'd6' ? 'tak' : 'shir';
        return 'tak';
    }

    function selector(){
        if (document.getElementById('tripv2WeatherSelect')) return;
        const intro = document.querySelector('.intro');
        if (!intro) return;

        const box = document.createElement('section');
        box.id = 'tripv2WeatherSelect';
        box.className = 'tripv2-weather-select';
        box.innerHTML = '<h2>🌨️ D6–D8 新穗高日子</h2>' +
            '<p>揀邊一日去新穗高。揀咗之後 D6–D8 會直接變成完整嘅「實際行程」：有今日重點、景點介紹、時間線同 📍，唔再同時顯示 Plan A／B／C。撳「重設」會返回原本規劃模式。</p>' +
            '<div class="tripv2-choice-row">' +
            '<button class="tripv2-choice" data-sh="d6">🚡 D6 去新穗高</button>' +
            '<button class="tripv2-choice" data-sh="d7">🚡 D7 去新穗高</button>' +
            '<button class="tripv2-choice" data-sh="d8">🚡 D8 去新穗高</button>' +
            '<button class="tripv2-choice reset" data-sh="">重設／規劃模式</button>' +
            '</div>';

        intro.insertAdjacentElement('afterend', box);

        box.querySelectorAll('[data-sh]').forEach(function(btn){
            btn.addEventListener('click', function(){
                const v = this.dataset.sh;
                if (v) localStorage.setItem(KEY, v);
                else localStorage.removeItem(KEY);
                render();
            });
        });
    }

    function escapeAttr(value){
        return String(value).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function timelineItem(item){
        const h3Attrs = item.map
            ? ' data-map="' + escapeAttr(item.map) + '"' + (item.mapLabel ? ' data-map-label="' + escapeAttr(item.mapLabel) + '"' : '')
            : '';
        const cardClass = item.hard ? 'timeline-card hard-cut' : 'timeline-card';
        return '<div class="timeline-item">' +
            '<div class="time">' + item.time + '</div>' +
            '<div class="' + cardClass + '">' +
            '<span class="event-type">' + item.type + '</span>' +
            '<h3' + h3Attrs + '>' + item.title + '</h3>' +
            '<p>' + item.desc + '</p>' +
            (item.price ? '<span class="price">' + item.price + '</span>' : '') +
            '</div></div>';
    }

    function restoreDay(id){
        const day = document.getElementById(id);
        if (!day) return;

        day.querySelectorAll('.tripv2-dynamic').forEach(function(el){ el.remove(); });
        day.querySelectorAll('.day-highlights,.quick-decision,.day-content').forEach(function(el){
            el.classList.remove('tripv2-hidden-original');
        });

        const title = day.querySelector('.day-title');
        const route = day.querySelector('.day-route');
        if (title) title.textContent = originalSummary[id].title;
        if (route) route.textContent = originalSummary[id].route;
    }

    function renderDay(id, selectedShinhotakaDay){
        const day = document.getElementById(id);
        if (!day) return;

        day.querySelectorAll('.tripv2-dynamic').forEach(function(el){ el.remove(); });

        if (!selectedShinhotakaDay){
            restoreDay(id);
            return;
        }

        day.querySelectorAll('.day-highlights,.quick-decision,.day-content').forEach(function(el){
            el.classList.add('tripv2-hidden-original');
        });

        const mode = modeFor(id, selectedShinhotakaDay);
        const plan = plans[id][mode];

        const title = day.querySelector('.day-title');
        const route = day.querySelector('.day-route');
        if (title) title.textContent = plan.summaryTitle;
        if (route) route.textContent = plan.summaryRoute;

        const dynamicHighlights = document.createElement('div');
        dynamicHighlights.className = 'day-highlights tripv2-dynamic';
        dynamicHighlights.innerHTML =
            '<div class="highlights-title">✅ 已選行程｜' + plan.heading + '</div>' +
            '<div class="highlights-grid">' +
            plan.highlights.map(function(h){
                return '<div class="highlight-item ' + h[0] + '">' + h[1] + '</div>';
            }).join('') +
            '</div>';

        const photo = day.querySelector('.photo-section');
        if (photo) photo.insertAdjacentElement('beforebegin', dynamicHighlights);

        const dynamicContent = document.createElement('div');
        dynamicContent.className = 'day-content tripv2-dynamic';
        dynamicContent.innerHTML =
            '<div class="tripv2-selected-note"><strong>' + plan.heading + '</strong><br>' + plan.note + '</div>' +
            '<div class="timeline">' + plan.items.map(timelineItem).join('') + '</div>' +
            (plan.bonus ? '<div class="special-box bonus">' + plan.bonus + '</div>' : '') +
            '<div class="day-buttons"><a class="button" href="index.html#' + id + '">📹 睇 ' + id.toUpperCase() + ' Live Cam</a></div>';

        if (photo) photo.insertAdjacentElement('afterend', dynamicContent);
        else day.querySelector('.day-inner').appendChild(dynamicContent);

        if (typeof addMapPins === 'function') addMapPins();
    }

    function render(){
        const selected = localStorage.getItem(KEY);
        document.querySelectorAll('.tripv2-choice').forEach(function(btn){
            btn.classList.toggle('active', !!selected && btn.dataset.sh === selected);
        });
        ['d6','d7','d8'].forEach(function(id){ renderDay(id, selected); });
    }

    document.addEventListener('DOMContentLoaded', function(){
        selector();
        render();
    });
})();
</script>'''

          s, n_js = old_script_pattern.subn(new_script, s, count=1)
