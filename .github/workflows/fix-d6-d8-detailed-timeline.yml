    border-left:5px solid #e0ac35;
}
.tripv2-weather-select h2 { margin:0 0 6px; color:#1f4e79; font-size:19px; }
.tripv2-weather-select p { margin:5px 0 10px; color:#5e6d78; font-size:13px; line-height:1.55; }
.tripv2-choice-row { display:flex; flex-wrap:wrap; gap:7px; }
.tripv2-choice {
    border:1px solid #cddce7; background:#eef4f8; color:#1f4e79;
    border-radius:8px; padding:9px 12px; font-weight:800; cursor:pointer;
}
.tripv2-choice.active { background:#1f4e79; color:#fff; border-color:#1f4e79; }
.tripv2-choice.reset { background:#f2f2f2; color:#666; border-color:#ddd; }
.tripv2-hidden-original { display:none !important; }
.tripv2-selected-note {
    margin-bottom:14px;
    background:#edf6ff;
    border-left:4px solid #4d86b1;
    border-radius:8px;
    padding:11px 13px;
    color:#4c6272;
    font-size:13px;
    line-height:1.6;
}
.tripv2-selected-note strong { color:#1f4e79; }
@media(max-width:720px){
    .tripv2-choice{flex:1 1 calc(33% - 7px); padding:9px 7px; font-size:12px;}
}
/* ===== /TRIP V2 D6-D8 SELECTOR ===== */'''

          s, n_css = old_css_pattern.subn(new_css, s, count=1)
          if n_css != 1:
