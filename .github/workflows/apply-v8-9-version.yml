name: Apply v8.9 Version

on:
  push:
    paths:
      - ".github/workflows/apply-v8-9-version.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update version and service worker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          p=Path('assets/site-shell-v7.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"const INSTALLED_VERSION = 'v[0-9.]+';", "const INSTALLED_VERSION = 'v8.9';", s, count=1)
          p.write_text(s,encoding='utf-8')

          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'const CACHE_NAME = "[^"]+";', 'const CACHE_NAME = "japan-winter-2027-v8.9-user-plan-20260930";', s, count=1)
          if '"./assets/trip-v8-9-user-fixes.js"' not in s:
              anchor='    "./assets/trip-v8-8-d2-plan.js",\n'
              s=s.replace(anchor,anchor+'    "./assets/trip-v8-9-user-fixes.js",\n',1)
          p.write_text(s,encoding='utf-8')

          Path('version.json').write_text(json.dumps({
              'version':'v8.9',
              'build':'2026-09-30.1',
              'updated':'2026-09-30T01:25:00+08:00',
              'notes':'Restore D2 Shiraito/Onioshidashi backups and 3-photo layout with daytime Matsumoto Castle; schedule shrines into D6-D8 without removing core sights; restore train/shrine topics; Google Maps opens place pages instead of driving directions.'
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-v8-9-version.yml
          git add assets/site-shell-v7.js sw.js version.json
          git commit -m "Finalize app v8.9"
          git push
