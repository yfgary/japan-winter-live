name: Apply v9 Final Itinerary Fixes

on:
  push:
    paths:
      - ".github/workflows/apply-v9-final.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate final JavaScript
        run: node --check assets/trip-v9-final-fixes.js

      - name: Apply v9.0 files
        run: python3 scripts/apply-v9-final.py

      - name: Commit app update and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add itinerary.html assets/site-shell-v7.js sw.js version.json assets/trip-v9-final-fixes.js
          git rm .github/workflows/apply-v9-final.yml scripts/apply-v9-final.py
          if [ -f .trigger-v89 ]; then git rm .trigger-v89; fi
          git commit -m "Finalize itinerary photos shrines and route stops v9.0"
          git push
