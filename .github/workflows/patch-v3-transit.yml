name: Patch V3 Transit Classification
on:
  push:
    paths:
      - '.github/workflows/patch-v3-transit.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and commit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/trip-enhancements-v3.js')
          s=p.read_text(encoding='utf-8')
          old=r"return !/(🚗|CHECK|HARD CUT|🍳|🍜|✈️|🚆|名鐵|入境|轉車|還車|入油|休息|溫泉 \/ 休息)/.test(type);"
          new=r"return !/(🚗|CHECK|HARD CUT|🍳|🍜|✈️|🚆|名鐵|入境|轉車|還車|入油|休息|溫泉 \/ 休息|Gondola|步行|接駁|Check-out)/.test(type);"
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/trip-enhancements-v3.js
          git commit -m "Keep transit timeline titles intact"
          git push
