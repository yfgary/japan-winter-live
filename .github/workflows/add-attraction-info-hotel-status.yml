              raise SystemExit('trip-info </body> not found')
          t = t.replace('</body>', trip_js + '\n</body>', 1)
          trip.write_text(t, encoding='utf-8')

          # Force PWA to refresh changed local HTML.
          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8')
          w = re.sub(r'japan-winter-2027-v\d+', 'japan-winter-2027-v4', w, count=1)
          sw.write_text(w, encoding='utf-8')
          PY

      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add itinerary.html trip-info.html sw.js
          git rm .github/workflows/add-attraction-info-hotel-status.yml
          git commit -m "Add detailed attraction info and hotel payment status"
