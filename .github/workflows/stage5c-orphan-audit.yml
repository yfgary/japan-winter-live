name: Stage 5C Orphan Asset Audit

on:
  push:
    branches:
      - stage5c-orphan-asset-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run orphan asset audit
        run: python scripts/audit_orphan_assets.py
