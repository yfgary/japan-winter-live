name: Validate V3 JavaScript
on:
  push:
    paths:
      - '.github/workflows/validate-v3.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --check assets/attraction-info.js
          node --check assets/trip-enhancement-data.js
          node --check assets/trip-user-overrides.js
          node --check assets/trip-deep-info-d1-d4.js
          node --check assets/trip-deep-info-d5-d9.js
          node --check assets/trip-deep-info-backups.js
          node --check assets/trip-enhancements-v3.js
          node --check sw.js
