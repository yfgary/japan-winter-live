name: Patch site version to v8.2

on:
  push:
    paths:
      - ".github/workflows/patch-version-v8-2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set v8.2
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          p=Path('assets/site-shell-v7.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"const INSTALLED_VERSION = 'v[^']+';", "const INSTALLED_VERSION = 'v8.2';", s, count=1)
          p.write_text(s,encoding='utf-8')

          p=Path('assets/trip-v8-data.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"version:'v[^']+'", "version:'v8.2'", s, count=1)
          p.write_text(s,encoding='utf-8')

          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'const CACHE_NAME = "japan-winter-2027-v[^"]+";', 'const CACHE_NAME = "japan-winter-2027-v8.2";', s, count=1)
          p.write_text(s,encoding='utf-8')

          p=Path('version.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          data['version']='v8.2'
          data['build']='2026-09-27.4'
          data['updated']='2026-09-27T21:41:00+08:00'
          data['notes']='Hotel breakfast inclusion and breakfast service times'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site-shell-v7.js assets/trip-v8-data.js sw.js version.json
          git rm .github/workflows/patch-version-v8-2.yml
          git commit -m "Set site version to v8.2"
          git push
