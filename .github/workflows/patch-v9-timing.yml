name: Patch v9 Shrine Timing

on:
  push:
    paths:
      - ".github/workflows/patch-v9-timing.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/patch-v9-timing.py
      - run: node --check assets/trip-v9-final-fixes.js
      - name: Commit and clean temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/trip-v9-final-fixes.js
          git rm .github/workflows/patch-v9-timing.yml scripts/patch-v9-timing.py
          git commit -m "Fix v9 shrine route timing"
          git push
